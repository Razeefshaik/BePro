# Render blueprint: one free web service that builds the app and runs the Express server.
# The server serves the built app (dist/) and the /api routes on the same port.
# The API key is not in this file: Render asks for LLM_API_KEY when you create the service.
services:
  - type: web
    name: bepro
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_JSON_MODE
        value: "false"
      - key: LLM_API_KEY
        sync: false
